[package]
name = "yi-agent-subagent"
description = "Application-owned subagent runtime construction shared by the CLI and the app-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
yi-agent-core = { workspace = true }
yi-agent-store = { workspace = true }
yi-agent-tools = { workspace = true }
yi-agent-runtime = { workspace = true }
# The one bring-up path. `subagent -> supervisors` is a downward edge (see the
# spec's dependency direction); the reverse would be a cycle.
yi-agent-supervisors = { workspace = true }
# Bring-up results, scopes, and deadlines are lifecycle wire types.
yi-agent-lifecycle = { workspace = true }

anyhow.workspace = true
async-trait = "0.1"
base64 = "0.22"
futures = { workspace = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.3"
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The foreground lifecycle is disabled in production builds (Task 11 turns it on), so a
# dev-dependency on the store's test hooks is the only way an integration test can serve
# those requests. Feature unification keeps this out of the shipped binary.
yi-agent-store = { workspace = true, features = ["foreground-test-support"] }
tempfile = "3"
yi-agent-lifecycle = { workspace = true }
# 集成测试用 flock 精确复现「别人正在起 daemon」的启动窗口。
libc = "0.2"
yi-agent-runtime = { workspace = true }
