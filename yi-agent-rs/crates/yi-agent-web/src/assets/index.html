<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yi-agent 配置</title>
<style>
  :root {
    --bg: #1a1b26;
    --surface: #24283b;
    --surface-hover: #2f334d;
    --border: #3b4261;
    --text: #c0caf5;
    --text-dim: #565f89;
    --accent: #7aa2f7;
    --accent-hover: #89b4fa;
    --success: #9ece6a;
    --warning: #e0af68;
    --error: #f7768e;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .env-path {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    word-break: break-all;
  }
  .layout {
    display: flex;
    gap: 1.5rem;
    min-height: 400px;
  }
  .sidebar {
    width: 180px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .tab {
    padding: 0.6rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.9rem;
    text-align: left;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  .main {
    flex: 1;
    min-width: 0;
  }
  .group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .group h2 {
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .section { margin-bottom: 1rem; }
  .section:last-child { margin-bottom: 0; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    padding: 0.5rem 0;
    font-size: 0.9rem;
    color: var(--text);
    font-weight: 600;
    user-select: none;
  }
  .section-header:hover { color: var(--accent); }
  .section-arrow {
    display: inline-block;
    transition: transform 0.15s;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .section.collapsed .section-arrow { transform: rotate(-90deg); }
  .section.collapsed .section-body { display: none; }
  .section-body {
    padding-top: 0.5rem;
  }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 0.35rem;
  }
  .field .desc {
    font-family: -apple-system, sans-serif;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: normal;
  }
  .field input, .field select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input.modified, .field select.modified {
    border-color: var(--warning);
  }
  .field .reset-btn {
    margin-top: 0.4rem;
    padding: 0.25rem 0.7rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .field .reset-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .field .reset-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .actions {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 1rem 0;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .save-btn {
    padding: 0.6rem 2rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .save-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .status.unsaved { color: var(--warning); }
  .status.saved { color: var(--success); }
  .toast {
    position: fixed;
    top: 1rem;
    right: 1rem;
    padding: 0.75rem 1.25rem;
    background: var(--success);
    color: var(--bg);
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--error); }
  .scope-toggle {
    display: inline-flex;
    gap: 0;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .scope-toggle button {
    padding: 0.5rem 1.25rem;
    background: var(--surface);
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
  }
  .scope-toggle button.active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }
  .scope-toggle button:hover:not(.active) { color: var(--text); }
  .source-label {
    font-size: 0.7rem;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    margin-left: 0.5rem;
    font-family: -apple-system, sans-serif;
    font-weight: normal;
  }
  .source-local { background: var(--accent); color: var(--bg); }
  .source-default { background: var(--surface-hover); color: var(--text-dim); }
</style>
</head>
<body>

<h1>yi-agent 配置</h1>
<div class="env-path" id="envPath">加载中...</div>
<p class="desc">模型请在桌面端「设置 → 模型」中配置（写入 <code>~/.yi-agent/models.json</code>）。此页面只管理非模型设置。</p>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="actions">
  <button class="save-btn" id="saveBtn" disabled>保存</button>
  <span class="status" id="status"></span>
</div>

<div class="toast" id="toast"></div>

<script>
  let allVars = [];
  let originalValues = {};
  let currentValues = {};
  // null 表示「还没加载到数据」。绝不能写死一个分组名——那正是本次故障的根因
  // （写死的 'Agent' 与后端的小写 'agent' 永远不相等，页面渲染出 0 个字段）。
  let activeTab = null;
  // 分组顺序跟随后端 FIELDS 的出现顺序，不在前端另排。
  let groupNames = [];
  // 显示名映射。缺映射时回退成原始 name（见 groupLabel），
  // 这样后端新增分组不会被前端吞掉。
  const GROUP_LABELS = { agent: 'Agent', compact: '压缩', startup: '启动' };
  const groupLabel = (name) => GROUP_LABELS[name] ?? name;

  function sourceLabel(source) {
    if (source === 'local') return '<span class="source-label source-local">本地</span>';
    if (source === 'default') return '<span class="source-label source-default">默认</span>';
    return '';
  }

  async function loadConfig() {
    const resp = await fetch('/api/config');
    const data = await resp.json();
    document.getElementById('envPath').textContent = '配置文件: ' + data.path;

    // 扁平化所有变量
    allVars = [];
    for (const group of data.groups) {
      for (const v of group.vars) {
        allVars.push(v);
        originalValues[v.key] = v.value;
        currentValues[v.key] = v.value;
      }
    }

    // 分组顺序由后端决定。activeTab 只在「当前选中的组已不存在」时才重置，
    // 避免每次保存后跳回第一个 tab。
    groupNames = data.groups.map((g) => g.name);
    if (!groupNames.includes(activeTab)) {
      activeTab = groupNames[0] ?? null;
    }

    renderSidebar();
    renderMain();
    updateSaveButton();
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    for (const tab of groupNames) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (tab === activeTab ? ' active' : '');
      // 显示中文名，但 activeTab 里存的必须是原始 name（agent），
      // 否则下面的 v.group === tabName 匹配不上。
      btn.textContent = groupLabel(tab);
      btn.addEventListener('click', () => {
        activeTab = tab;
        renderSidebar();
        renderMain();
      });
      sidebar.appendChild(btn);
    }
  }

  function renderMain() {
    const main = document.getElementById('main');
    main.innerHTML = '';

    if (activeTab === null) {
      const empty = document.createElement('p');
      empty.className = 'desc';
      empty.textContent = '没有可配置项。';
      main.appendChild(empty);
      return;
    }

    renderFlatTab(main, activeTab);
  }

  function renderFlatTab(main, tabName) {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    groupEl.innerHTML = `<h2>${groupLabel(tabName)}</h2>`;

    for (const v of allVars) {
      if (v.group === tabName) {
        renderField(groupEl, v);
      }
    }

    main.appendChild(groupEl);
  }

  function renderField(container, v) {
    const field = document.createElement('div');
    field.className = 'field';

    const label = document.createElement('label');
    const labelText = document.createElement('span');
    labelText.textContent = v.label || v.key;
    labelText.title = v.key; // 悬停可看到机器键名，便于对照文档
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = v.description;
    label.append(labelText, desc);
    label.insertAdjacentHTML('beforeend', sourceLabel(v.source));

    let inputEl;
    const currentValue = currentValues[v.key] !== undefined ? currentValues[v.key] : v.value;
    if (v.type === 'select') {
      inputEl = document.createElement('select');
      // 显式空选项：未设置时浏览器否则会自动选第一项（read-only），
      // 而运行时默认其实是 workspace-write，用户会以为默认是只读。
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = `未设置（默认 ${v.default || '—'}）`;
      // 显式指定，不依赖浏览器「没有 selected 就选第一个」的隐式行为
      blank.selected = currentValue === null || currentValue === undefined;
      inputEl.appendChild(blank);
      for (const opt of v.options) {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        if (opt === (currentValue ?? '')) o.selected = true;
        inputEl.appendChild(o);
      }
    } else {
      inputEl = document.createElement('input');
      inputEl.type = v.type === 'number' ? 'number' : 'text';
      inputEl.value = currentValue === null ? '' : currentValue;
      inputEl.placeholder = v.default || '(none)';
      // 后端给了 min/max 就套上去。JSON null 在 JS 里是 null，
      // 用 != null 同时排除 null 与 undefined（否则会写成属性 "null"）。
      if (v.type === 'number') {
        if (v.min != null) inputEl.min = v.min;
        if (v.max != null) inputEl.max = v.max;
      }
    }

    inputEl.dataset.key = v.key;
    inputEl.dataset.type = v.type;
    inputEl.addEventListener('input', onFieldChange);
    inputEl.addEventListener('change', onFieldChange);
    field.appendChild(inputEl);

    const reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'reset-btn';
    reset.textContent = '恢复默认';
    // 已经是「未设置」时没有可恢复的东西。
    reset.disabled = currentValues[v.key] === null;
    reset.addEventListener('click', () => {
      // 置 null 即可：save() 用 currentValues !== originalValues 做差异检测，
      // null 与任何字符串都不等，会自动收进 updates 并发成 JSON null。
      // 不需要额外的「待删除集合」。
      currentValues[v.key] = null;
      inputEl.value = '';
      reset.disabled = true;
      updateSaveButton();
    });
    inputEl.addEventListener('change', () => {
      reset.disabled = currentValues[v.key] === null;
    });
    field.appendChild(reset);

    field.insertBefore(label, field.firstChild);
    container.appendChild(field);
  }

  function onFieldChange(e) {
    const key = e.target.dataset.key;
    const newValue = e.target.value;
    currentValues[key] = newValue;

    const original = originalValues[key];
    if (newValue !== original) {
      e.target.classList.add('modified');
    } else {
      e.target.classList.remove('modified');
    }


    updateSaveButton();
  }

  function updateSaveButton() {
    let hasChanges = false;
    for (const key in currentValues) {
      if (currentValues[key] !== originalValues[key]) {
        hasChanges = true;
        break;
      }
    }
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('status');
    btn.disabled = !hasChanges;
    if (hasChanges) {
      status.className = 'status unsaved';
      status.textContent = '有未保存的修改';
    } else {
      status.className = 'status';
      status.textContent = '';
    }
  }

  async function save() {
    const updates = [];
    for (const key in currentValues) {
      if (currentValues[key] !== originalValues[key]) {
        updates.push({ key, value: currentValues[key] });
      }
    }
    if (updates.length === 0) return;

    const resp = await fetch('/api/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updates }),
    });

    if (resp.ok) {
      showToast('已保存', false);
      await loadConfig();
    } else {
      const data = await resp.json().catch(() => ({}));
      showToast(data.error || '保存失败', true);
    }
  }

  function showToast(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => toast.className = 'toast', 2500);
  }

  document.getElementById('saveBtn').addEventListener('click', save);

  loadConfig();
</script>

</body>
</html>
