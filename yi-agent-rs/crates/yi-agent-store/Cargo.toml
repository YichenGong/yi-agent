[package]
name = "yi-agent-store"
description = "Session persistence layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
yi-agent-core = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
futures = { workspace = true }
sha2 = "0.10"
# Fork payloads travel over the IPC as base64 text and are decoded here.
base64 = "0.22"
# Advisory file locking for the daemon instance lock (`flock`).
libc = "0.2"
# The daemon records why a request failed; `error_response` drops that detail to
# keep the wire contract stable, so without a log the cause is unrecoverable.
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
