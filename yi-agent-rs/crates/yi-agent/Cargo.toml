[package]
name = "yi-agent"
description = "A coding agent CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "yi-agent"
path = "src/main.rs"

[dependencies]
yi-agent-core = { workspace = true }
yi-agent-llm = { workspace = true }
yi-agent-tools = { workspace = true }
yi-agent-mcp = { workspace = true }
yi-agent-store = { workspace = true }
yi-agent-web = { workspace = true }
yi-agent-skills = { workspace = true }
yi-agent-runtime = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { workspace = true }
crossterm = { workspace = true }
dotenvy = { workspace = true }

dirs = "5"

ratatui = { workspace = true }
unicode-width = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true, optional = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

chrono = { workspace = true }
uuid = { workspace = true }

async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
syntax-highlight = ["dep:syntect"]
