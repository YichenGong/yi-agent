[package]
name = "yi-agent"
description = "A coding agent CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "yi-agent"
path = "src/main.rs"

[dependencies]
yi-agent-core = { workspace = true }
yi-agent-tools = { workspace = true }
yi-agent-mcp = { workspace = true }
yi-agent-store = { workspace = true }
yi-agent-lifecycle = { workspace = true }
yi-agent-flags = { workspace = true }
yi-agent-web = { workspace = true }
yi-agent-runtime = { workspace = true }
yi-agent-app-server = { workspace = true }
yi-agent-relay = { workspace = true }
yi-agent-subagent = { workspace = true }
yi-agent-supervisors = { path = "../yi-agent-supervisors" }
yi-agent-plugins = { workspace = true }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
url = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true }
qrcode = "0.14"

dirs = "5"

ratatui = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true, optional = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

uuid = { workspace = true }

async-trait = "0.1"

# `libc::poll` bounds the OSC 11 probe to 200ms; crossterm's `event::read`
# would consume the reply byte before a plain `Read` could see it.
libc = "0.2"

# The build script hashes build inputs into the artifact id, so it needs the same
# digest crate the test uses.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# 集成测试现场打一个签名包：清单与元数据的编码规则复用生产实现，
# 不在这里手抄一份（两份规则分叉正是签名验证被绕过的形状）。
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde_json = { workspace = true }
libc = "0.2"
proptest = { workspace = true }
toml = "0.8"
regex = "1"

[features]
default = []
syntax-highlight = ["dep:syntect"]
