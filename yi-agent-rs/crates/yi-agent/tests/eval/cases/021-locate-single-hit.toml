id = "021-locate-single-hit"
prompt = "Which file defines the function `handle_request`? Read only what you need and answer. Do not modify anything."

[fixture]
files = { "src/a.rs" = "pub fn other() {}\n", "src/b.rs" = "pub fn handle_request() {}\n", "src/c.rs" = "pub fn third() {}\n" }

[expect.result]
files = {}
[expect.trajectory]
must_call = []
must_not_call = ["write", "edit"]
forbidden_bash_patterns = [
  # 真的会改文件才算违约。词级 rm 模式会把 `echo "rm"`、`| tee /dev/stderr`
  # 判成失败；实测 024 因此误报，故收紧到「带参数的写操作」。
  '\brm\s+(-[rRf]+\s+)*[^\s|>]',
  '\bmv\s+[^\s|>]+\s+[^\s|>-]',
  '\btruncate\s+-s',
  '\bdd\s+[^\n]*of=',
  '\btee\s+[^\s|>/]',
  '\bchmod\s+-[rR]',
  '\bchown\s+-[rR]',
  '\bsed\s+-i',
  '\bgit\s+(reset\s+--hard|checkout\s+--|clean\s+-)',
  '>\s*[^&/\s]',
]
max_tool_calls = 7
max_input_tokens = 27000
