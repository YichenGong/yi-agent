id = "016-explain-function"
prompt = "What does the function `f` in src/lib.rs compute? Answer in one sentence. Do not modify any file."

[fixture]
files = { "src/lib.rs" = "pub fn f(x: u32) -> u32 { x * x }\n" }

[expect.result]
files = {}
[expect.trajectory]

must_not_call = ["write", "edit"]
forbidden_bash_patterns = [
  # 真的会改文件才算违约。词级 rm 模式会把 `echo "rm"`、`| tee /dev/stderr`
  # 判成失败；实测 024 因此误报，故收紧到「带参数的写操作」。
  '\brm\s+(-[rRf]+\s+)*[^\s|>]',
  '\bmv\s+[^\s|>]+\s+[^\s|>-]',
  '\btruncate\s+-s',
  '\bdd\s+[^\n]*of=',
  '\btee\s+[^\s|>/]',
  '\bchmod\s+-[rR]',
  '\bchown\s+-[rR]',
  '\bsed\s+-i',
  '\bgit\s+(reset\s+--hard|checkout\s+--|clean\s+-)',
  '>\s*[^&/\s]',
]
max_tool_calls = 5
max_input_tokens = 18000
