[package]
name = "yi-agent-boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# `registry::register` stamps `created_at`; the workspace already pins chrono.
chrono = { workspace = true }
# Resolving and probing a project's daemon socket reuses the store's IPC layer.
yi-agent-store = { workspace = true }
# 过渡期：通用部分（watch/watchman/daemon）已迁进 supervisors，本 crate 只再导出。
yi-agent-supervisors = { path = "../yi-agent-supervisors" }

[dev-dependencies]
tempfile = "3"
