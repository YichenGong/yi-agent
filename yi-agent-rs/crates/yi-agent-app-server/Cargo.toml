[package]
name = "yi-agent-app-server"
description = "yi-agent GUI app-server: JSON-RPC 2.0 over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
yi-agent-core = { workspace = true }
yi-agent-runtime = { workspace = true }
yi-agent-store = { workspace = true }
yi-agent-subagent = { workspace = true }
yi-agent-tools = { workspace = true }
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio-tungstenite = "0.29"
