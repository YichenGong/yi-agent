[package]
name = "yi-agent-app-server"
description = "yi-agent GUI app-server: JSON-RPC 2.0 over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# 线协议类型（`src/protocol.rs`）的 TypeScript 绑定从这里生成，桌面端不再手抄
# 一份镜像（`desktop/src/lib/generated/`）。`serde-compat` 让生成物跟随
# `#[serde(...)]` 的大小写/标签约定，即线上 JSON 形状。
ts-rs = { version = "11", features = ["serde-compat"] }
yi-agent-core = { workspace = true }
yi-agent-runtime = { workspace = true }
yi-agent-store = { workspace = true }
yi-agent-subagent = { workspace = true }
# `skill/list` / `skill/read` 枚举与读取三层 skill 根。
yi-agent-skills = { workspace = true }
yi-agent-tools = { workspace = true }
# The embedded relay client (outbound wss) used by `serve_stdio_with_relay`: the
# desktop and a relay-attached phone must share ONE `serve()` loop.
yi-agent-relay = { workspace = true }
# The board RPCs read the global registry and drive the board lifecycle.
yi-agent-boards = { path = "../yi-agent-boards" }
# `plugins/list` reads the plugin manifests under `<workdir>/.yi-agent/supervisors`.
yi-agent-supervisors = { path = "../yi-agent-supervisors" }
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
# `lead::ensure_lead_meta` 给组长 meta 盖创建时间戳(epoch 毫秒)。与
# `yi-agent-runtime` 同一份工作区依赖,不引入新版本。
chrono.workspace = true
async-trait = "0.1"
# `image/read` 分片回传的是原始字节，base64 只在响应体的 `data` 字段出现。
base64 = "0.22"
form_urlencoded = "1"
futures.workspace = true
# `image/read` 用 `guess_format` 校验「这是不是一张真有格式头的图片」，把该 RPC
# 限制成「只送可解码的图」，不成为任意文件读取原语。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
# `devices.json` 的读-改-写要在内核 `flock` 下跨进程串行化(见 device_store.rs):
# 该表被桌面侧车、`--relay` 实例与 CLI 共享,进程内 `Mutex` 挡不住别的进程。
libc = "0.2"
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
# Endpoint stubbing for the `onboarding/*` connection probe tests.
wiremock = "0.6"
tokio-tungstenite = "0.29"
# 造真 PNG 当图片输入夹具的 `image` 已是正式依赖（见上），此处不再重复声明。
# Capture `tracing` output in tests for the preference-loading warnings. Same
# dev-dependency and pattern already used by `yi-agent-store`'s
# `error_logging_tests`; the shared workspace dependency avoids a new version.
tracing-subscriber = { workspace = true }
