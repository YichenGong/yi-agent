# GitLab CI 配置
# push 到分支时在 Mac mini self-hosted runner 上跑
# MR 走云端 runner(不进 Mac mini,安全考虑)

stages:
  - check
  - release

variables:
  CARGO_TERM_COLOR: "always"

# 缓存 cargo registry(只读并发安全)和 target 目录(编译产物)
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/
    - ~/cargo-target/  # CARGO_TARGET_DIR 输出目录

# push 到分支时跑(Mac mini self-hosted)
ci-push:
  stage: check
  tags:
    - mac-mini
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    # 加载 rustup 环境(shell executor 非交互式不加载 .bashrc)
    - source "$HOME/.cargo/env" 2>/dev/null || true
    # rustup 缺失则自动安装(self-healing,兼容新 runner 用户)
    - command -v rustup >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
    - source "$HOME/.cargo/env"
    - export CARGO_TARGET_DIR="$HOME/cargo-target/gitlab"
    - mkdir -p "$CARGO_TARGET_DIR"
    - cd yi-agent-rs
    - rustup default stable
    - rustup update stable
    # msrv-check 用声明的 rust-version 真编译；不装这个工具链该门禁必红。
    - rustup toolchain install 1.89.0 --profile minimal
    - export PATH="$HOME/.local/bin:$PATH"
    - just --version 2>/dev/null || curl -sSf https://just.systems/install.sh | sh -s -- --to "$HOME/.local/bin"
    - just --version
    - just ci
    # 共享运行时生命周期的真进程验收。放在 `just ci` 之后单独跑，理由同
    # GitHub 侧：这些目标会真的 fork guardian／daemon／子进程，混进 `just ci`
    # 的 nextest 批量运行后，失败定位与超时预算都会变得难以解释。
    #
    # 只放在 Mac mini 这条 push 路径上，云端 `ci-mr` 不跑：它用的是 Linux
    # `rust:latest`，而进程组语义（以及 `kill(-pgid, 0)` 对只剩 zombie 的自有组
    # 返回 EPERM 这类事实）在 Linux 与 macOS 上不等价 —— 在云端跑通不代表 macOS
    # 上成立，那正是本期要验证的部分。
    - just runtime-lifecycle-check

# MR(Merge Request)走云端 runner
ci-mr:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image: rust:latest
  before_script:
    - cd yi-agent-rs
    - curl -sSf https://just.systems/install.sh | sh -s -- --to /usr/local/bin
    # rust:latest 自带 rustup；再装声明的 MSRV，供 msrv-check 使用。
    - rustup toolchain install 1.89.0 --profile minimal
  script:
    - just ci

# 桌面端类型检查 + 单元测试。独立 job + node 镜像：MR 路径的 ci-mr 用的是
# rust:latest，没有 Node。与 ci-mr 一样跑在云端 runner（不加 tags，不进
# Mac mini），MR 与 push 两条路径统一走这里，不依赖 runner 上预装 node。
#
# 用 node:22：vite 8 允许 `^20.19.0 || >=22.12.0`，Node 20 也可行，
# 取 22 是因为 v20 已停止发版（最后 v20.20.2 / 2026-03-24），v22 仍是活跃 LTS。
ci-desktop:
  stage: check
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates >/dev/null
    - curl -sSf https://just.systems/install.sh | sh -s -- --to /usr/local/bin
  script:
    - cd yi-agent-rs
    - just desktop-check

# 插件是独立 workspace + 独立 Node 前端，门禁单独一个 job，且**只跑云端
# runner**（不加 tags，因此不进 Mac mini）。签名私钥只在受保护环境的插件
# release workflow 里，这个 job 碰不到；不可信 MR 因此无法借它读取密钥。
#
# 用 rust:latest 而不是 node: 镜像：要在同一个 job 里跑 Rust 与 Node 两套，
# 装 Node 比装整套 Rust 便宜。
ci-plugins:
  stage: check
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg git >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
    - bash /tmp/nodesource.sh >/dev/null
    - apt-get install -y --no-install-recommends nodejs >/dev/null
    - curl -sSf https://just.systems/install.sh -o /tmp/install-just.sh
    - sh /tmp/install-just.sh --to /usr/local/bin
    - rustup component add rustfmt
  script:
    - cd yi-agent-rs
    - just plugin-workspace-check
    - just plugin-ui-check
    - just plugin-contracts-check
    - just plugin-boundary-check
    - just plugin-acceptance-check

# tag 推送时在 Mac mini 上构建并发布 macOS(arm64) 桌面 App 的 dmg。
# 逻辑全部在 desktop/scripts/release-dmg.sh 里，job 保持薄。
release:macos-dmg:
  stage: release
  tags:
    - mac-mini
  rules:
    - if: $CI_COMMIT_TAG
  # 同一 tag 不并发发布（重跑安全，脚本内已做建/改 Release 的分支）
  resource_group: release-macos-dmg
  interruptible: false
  variables:
    # 构建期版本标识需要 tag 与历史；GitLab 默认浅克隆会把它判成 nogit。
    GIT_DEPTH: "0"
  script:
    # 与 GitHub 侧同一道门禁：tag 必须落在 main 可达的提交上。
    - git fetch --no-tags origin main || true
    - bash yi-agent-rs/scripts/check-tag-on-main.sh "$CI_COMMIT_TAG" origin/main
    - bash desktop/scripts/release-dmg.sh
