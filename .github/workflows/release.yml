name: Release

# tag 推送时触发,跑在 Mac mini self-hosted runner
on:
  push:
    tags:
      - "v*.*.*"

# 防止误推两次 tag 时并发跑两个 release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted  # Mac mini 上注册的 GitHub Actions runner
    permissions:
      contents: write  # softprops/action-gh-release 需要写权限创建 Release
    env:
      # 只放与机器无关的开关。PATH / CARGO_TARGET_DIR 依赖 runner 的
      # 登录用户，统一在下面的 prepare step 里用 $HOME 推导后导出到
      # GITHUB_ENV / GITHUB_PATH。曾把两者硬编码成 /Users/agenticlabs/…，
      # runner 用户一变（GitLab 侧就遇到过 agenticlabs 与 gongyichen 两种），
      # cargo 连 target 目录都建不出来，构建 1~3 秒即失败。
      CARGO_TERM_COLOR: always
    steps:
      # fetch-depth: 0 是必须的：构建期版本标识靠 `git describe --tags`
      # 判定 release/dev，浅克隆里没有 tag，二进制会被标成 `+nogit`，
      # 流水线末尾的门禁会拒绝发布。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare runner environment
        run: |
          # 用 runner 自己的 HOME 推导，换用户/换机器都不必改 workflow。
          # cargo 创建 target 目录失败会立刻退出，所以这里先建好并验证可写。
          echo "CARGO_TARGET_DIR=$HOME/cargo-target/github" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin" "$HOME/cargo-target/github"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cargo-target/github"
          ls -ld "$HOME/cargo-target/github"

      - name: Verify tag matches Cargo.toml version
        id: version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CARGO_VERSION=$(grep '^version' yi-agent-rs/Cargo.toml | head -1 | awk -F'"' '{print $2}')
          if [ "v$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Git tag ($TAG_VERSION) does not match Cargo.toml version (v$CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"
          # 供后续 step 复用
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        run: |
          # rustup 缺失时自愈（runner 换用户后 $HOME 下可能没有 rustup）
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          # `default stable` 只切换别名，不会升级已装工具链。依赖的 MSRV
          # 会随 Cargo.lock 抬升（0.1.4 起最高 1.88，0.1.7 起 1.89），
          # 不 update 就会在解析阶段失败。
          rustup update stable
          rustup default stable
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            if ! rustup target list --installed 2>/dev/null | grep -q "^$target$"; then
              rustup target add "$target"
            fi
          done
          rustup target list --installed
          rustc --version

      - name: Ensure cargo-zigbuild installed
        run: |
          source "$HOME/.cargo/env"
          command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild --locked

      - name: Ensure zig available
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            echo "ERROR: zig not found. Install with: brew install zig"
            exit 1
          fi
          zig version

      - name: Ensure just installed
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v just >/dev/null 2>&1; then
            curl -sSf https://just.systems/install.sh | sh -s -- --to "$HOME/.local/bin"
          fi
          just --version

      - name: Build & package all platforms
        working-directory: yi-agent-rs
        run: |
          source "$HOME/.cargo/env"
          just package-all

      - name: Verify the binary reports the release version
        working-directory: yi-agent-rs
        run: |
          source "$HOME/.cargo/env"
          # 交叉编译的另两个 target 在本机跑不起来；版本串由同一份源码、
          # 同一次 git 状态生成，检查 host target 即可代表全部产物。
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          BIN="${CARGO_TARGET_DIR:-target}/$HOST/release/yi-agent"
          if [ ! -x "$BIN" ]; then
            echo "ERROR: expected the host binary at $BIN"
            exit 1
          fi
          bash scripts/check-release-version.sh "${{ steps.version.outputs.version }}" \
            "$("$BIN" --version | awk '{print $2}')"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yi-agent-rs/dist/*.tar.gz
            yi-agent-rs/dist/*.sha256
          generate_release_notes: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: yi-agent-rs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just npm-publish

      - name: Update Homebrew tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./.github/scripts/update-homebrew-tap.sh "${{ github.ref_name }}" "$VERSION"
