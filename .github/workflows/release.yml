name: Release

# tag 推送时触发,跑在 Mac mini self-hosted runner
on:
  push:
    tags:
      - "v*.*.*"

# 防止误推两次 tag 时并发跑两个 release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted  # Mac mini 上注册的 GitHub Actions runner
    permissions:
      contents: write  # softprops/action-gh-release 需要写权限创建 Release
    env:
      # 只放与机器无关的开关。PATH / CARGO_TARGET_DIR 依赖 runner 的
      # 登录用户，统一在下面的 prepare step 里用 $HOME 推导后导出到
      # GITHUB_ENV / GITHUB_PATH。曾把两者硬编码成 /Users/agenticlabs/…，
      # runner 用户一变（GitLab 侧就遇到过 agenticlabs 与 gongyichen 两种），
      # cargo 连 target 目录都建不出来，构建 1~3 秒即失败。
      CARGO_TERM_COLOR: always
    steps:
      # fetch-depth: 0 是必须的：构建期版本标识靠 `git describe --tags`
      # 判定 release/dev，浅克隆里没有 tag，二进制会被标成 `+nogit`，
      # 流水线末尾的门禁会拒绝发布。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare runner environment
        run: |
          # 用 runner 自己的 HOME 推导，换用户/换机器都不必改 workflow。
          # cargo 创建 target 目录失败会立刻退出，所以这里先建好并验证可写。
          echo "CARGO_TARGET_DIR=$HOME/cargo-target/github" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin" "$HOME/cargo-target/github"
          # GITHUB_PATH 是「后写的在前」，所以这里先写 /opt/homebrew/bin，
          # 再写 $HOME/.cargo/bin，保证 rustup 的 shim 最终排在 Homebrew 之前。
          # 顺序反了会让 Homebrew 的 rust 抢到 cargo，交叉编译以
          # E0463 "can't find crate for core" 秒挂（实测 0.5~3 秒）。
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cargo-target/github"
          ls -ld "$HOME/cargo-target/github"

      - name: Verify the tag is on main
        run: |
          # release.yml 只由 tag 触发，且只打包、不跑测试。一个打在未合并
          # 功能分支上的 tag 会被直接发布出去，线上版本从此脱离主干。
          # 这里在动编译器之前就把它拦下来。
          git fetch --no-tags origin main || true
          bash yi-agent-rs/scripts/check-tag-on-main.sh "${{ github.ref_name }}" origin/main

      - name: Verify tag matches Cargo.toml version
        id: version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CARGO_VERSION=$(grep '^version' yi-agent-rs/Cargo.toml | head -1 | awk -F'"' '{print $2}')
          if [ "v$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Git tag ($TAG_VERSION) does not match Cargo.toml version (v$CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"
          # 供后续 step 复用
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        run: |
          # rustup 缺失时自愈（runner 换用户后 $HOME 下可能没有 rustup）
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          # `default stable` 只切换别名，不会升级已装工具链。依赖的 MSRV
          # 会随 Cargo.lock 抬升（0.1.4 起最高 1.88，0.1.7 起 1.89），
          # 不 update 就会在解析阶段失败。
          rustup update stable
          rustup default stable
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            if ! rustup target list --installed 2>/dev/null | grep -q "^$target$"; then
              rustup target add "$target"
            fi
          done
          rustup target list --installed
          rustc --version

      - name: Ensure cargo-zigbuild installed
        run: |
          source "$HOME/.cargo/env"
          command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild --locked

      - name: Ensure zig available
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            echo "ERROR: zig not found. Install with: brew install zig"
            exit 1
          fi
          zig version

      - name: Ensure just installed
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v just >/dev/null 2>&1; then
            curl -sSf https://just.systems/install.sh | sh -s -- --to "$HOME/.local/bin"
          fi
          just --version

      - name: Build & package all platforms
        working-directory: yi-agent-rs
        run: |
          # setup-build-env.sh 会重排 PATH（rustup 优先）、抬高文件描述符上限
          # （launchd 默认 256，并行链接 Linux 目标会 ProcessFdQuotaExceeded），
          # 并校验三平台 std 与 zig/zigbuild 真的可用。任一不满足即失败，
          # 避免把「环境不对」伪装成「代码编译错误」。
          source scripts/setup-build-env.sh
          # 这里**不**跑 `just release-targets-check`。它校验的正是下面
          # `package-all` 要编的三个目标，放在这里是纯重复：实测让这一步从
          # 2m36s（v0.1.13）涨到 8m13s，并多占 6.1G target 空间。发布失败的
          # 信息量也不会更好——package-all 失败时同样会点名是哪个目标。
          #
          # 它的位置在 PR/合并前（GitLab `ci-push`），那才是能在 tag 之前
          # 拦住「用了只有 macOS 才有的 API、却没有 cfg 隔离」的地方：
          # v0.1.14 就是这么一路绿到 tag 才翻车的。
          just package-all

      - name: Verify the binary reports the release version
        working-directory: yi-agent-rs
        run: |
          source "$HOME/.cargo/env"
          # 交叉编译的另两个 target 在本机跑不起来；版本串由同一份源码、
          # 同一次 git 状态生成，检查 host target 即可代表全部产物。
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          BIN="${CARGO_TARGET_DIR:-target}/$HOST/release/yi-agent"
          if [ ! -x "$BIN" ]; then
            echo "ERROR: expected the host binary at $BIN"
            exit 1
          fi
          bash scripts/check-release-version.sh "${{ steps.version.outputs.version }}" \
            "$("$BIN" --version | awk '{print $2}')"

      - name: Setup Node.js
        # 必须排在桌面构建**之前**。`just npm-pack-desktop` 会跑
        # `tauri build`，其 beforeBuildCommand 是 `npm run build`
        # （`tsc && vite build`），而 vite 8 的 engines 是
        # `^20.19.0 || >=22.12.0` 这种硬约束。
        #
        # 之前这一步排在发布之后，桌面构建用的是 self-hosted runner 预装的
        # node——那是一台持久机器，node 版本会随机器维护漂移，而同一步在
        # v0.1.13 通过、v0.1.15 失败（34s 秒挂，缓存已热说明不是编译慢）。
        # 把 node 固定成 22（LTS，满足上面的 engines），构建就不再依赖
        # runner 当下装了什么。
        #
        # registry-url 一并放在这里：后面的 `Publish to npm` 依赖它写
        # .npmrc，setup-node 只需执行一次。
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build macOS desktop app for npm
        # 只有 arm64 的 .app 会进 darwin-arm64 子包。Linux/Intel 用户
        # 不会因此多下载——npm 按 os/cpu 只装匹配的子包。
        # working-directory 不能省：justfile 在 yi-agent-rs/ 下，仓库根没有，
        # 漏掉会让 just 在 0.03 秒内以「no justfile found」退 1。
        working-directory: yi-agent-rs
        run: |
          source "$HOME/.cargo/env"
          # 这里的 `tauri build` 会编 desktop/src-tauri 并链接 release 依赖，
          # 与第 10 步是同一类工作，所以需要同一套环境准备。之前只有
          # `source ~/.cargo/env`，漏掉了 `setup-build-env.sh` 做的两件事：
          #
          #   1. 重排 PATH，让 rustup 的 shim 排在 Homebrew 的 rust 之前。
          #      runner 的 /opt/homebrew/bin 里有 Homebrew 装的 rust，抢到
          #      `cargo` 后它的 sysroot 里没有 rustup 装的跨平台 std，交叉
          #      编译以 E0463 秒挂（第 10 步的注释记着实测 0.5~3 秒）。
          #   2. 把 fd 上限从 launchd 默认的 256 抬到 65536。并行链接 release
          #      依赖时 256 会撞 `ProcessFdQuotaExceeded`。
          #
          # 第 12 步现在 34s 内失败（v0.1.13 那会儿是 186s 成功），符合
          # 「环境不对、早早退 1」而不是「编译到一半报错」的形状。
          #
          # 只校验 host 目标：这一步不交叉编译，默认那三个目标里的 linux
          # 会连带要求 zig 与 cargo-zigbuild，凭空多出两个失败点。
          SETUP_BUILD_ENV_TARGETS=aarch64-apple-darwin source scripts/setup-build-env.sh
          # 失败几乎没有信息量：`just` 只回一行 "exit status 1"，而真正的
          # 原因（磁盘写满 / .app 缺失 / codesign 拒绝）要往上翻几十行。
          # v0.1.15 的这次失败就因此无法从日志判断。runner 是持久机器，
          # 磁盘与 target 目录状态本来就会漂移，所以先把它们打出来。
          echo "== runner disk =="
          df -h "$HOME" || true
          echo "== target dir =="
          du -sh "${CARGO_TARGET_DIR:-$PWD/target}" 2>/dev/null || true
          rc=0
          just npm-pack-desktop || rc=$?
          # 脚本 0 退但产物不在，是第 14 步 0 秒失败的那种形状（v0.1.15 的
          # 第七次就是）。这里立刻核对产物，避免下一段只能看到一个缺失断言。
          PKG_DIR="yi-agent-cli/platforms/darwin-arm64"
          if [ -d "$PKG_DIR/yi-agent.app" ]; then
            echo "::notice title=npm-package::packaged $(du -sh "$PKG_DIR/yi-agent.app" | cut -f1)"
          else
            echo "::error title=npm-package::no yi-agent.app in $(pwd)/$PKG_DIR after packaging (rc=$rc)"
            ls -la "$PKG_DIR" 2>&1 || true
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::npm-pack-desktop failed with code $rc"
            echo "== disk after failure =="
            df -h "$HOME" || true
            echo "== bundle dir =="
            ls -l "${CARGO_TARGET_DIR:-$PWD/target}/release/bundle/macos/" 2>&1 || true
          fi
          exit "$rc"

      - name: Verify the desktop app is in the npm package
        # 构建「成功」但 .app 没进包的情况最难查（用户装完发现没有 App）。
        # 这里在发布前直接验白名单产物。
        run: |
          # 这一步失败时也没有信息量（v0.1.15 第六次就在这里 0 秒退 1），
          # 所以先确认路径与目录内容，再逐条断言。
          echo "== cwd =="; pwd
          echo "== platforms dir =="
          ls -la yi-agent-rs/yi-agent-cli/platforms/ 2>&1 || true
          ls -la yi-agent-rs/yi-agent-cli/platforms/darwin-arm64/ 2>&1 || true
          cd yi-agent-rs/yi-agent-cli/platforms/darwin-arm64
          test -d yi-agent.app || {
            echo "::error title=npm-package::yi-agent.app missing under $(pwd)" || true
            echo "ERROR: yi-agent.app missing"; exit 1; }
          # 不用 --deep 校验：清单记录的是 sidecar 的最终字节摘要，而 --deep
          # 会强制校验嵌套二进制，语义与发布时的实际签名顺序不一致。
          codesign --verify --strict yi-agent.app

          # 清单必须存在，且其 sha256 必须等于包里 sidecar 的实际摘要。
          # 这是「发出去的 App 能证明自己带的 daemon 是谁」的唯一凭据。
          M=yi-agent.app/Contents/Resources/runtime-sidecar.json
          test -f "$M" || { echo "ERROR: runtime sidecar manifest missing"; exit 1; }
          RECORDED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$M")
          ACTUAL=$(shasum -a 256 yi-agent.app/Contents/MacOS/yi-agent | awk '{print $1}')
          [ "$RECORDED" = "$ACTUAL" ] || {
            echo "ERROR: sidecar digest mismatch: manifest=$RECORDED actual=$ACTUAL"; exit 1; }
          echo "runtime build id: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build_id"])' "$M")"
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              yi-agent.app/Contents/Info.plist)
          echo "desktop app version: $V"
          # 从 platforms/darwin-arm64 往上三级才是 yi-agent-rs/Cargo.toml。
          # 两级只到 yi-agent-cli/，那里没有 Cargo.toml，门禁会假绿或假红。
          grep -q "^version = \"$V\"" ../../../Cargo.toml || {
            echo "ERROR: desktop app version $V != workspace version"; exit 1; }

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yi-agent-rs/dist/*.tar.gz
            yi-agent-rs/dist/*.sha256
          generate_release_notes: true

      - name: Publish to npm
        working-directory: yi-agent-rs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just npm-publish

      - name: Update Homebrew tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./.github/scripts/update-homebrew-tap.sh "${{ github.ref_name }}" "$VERSION"
