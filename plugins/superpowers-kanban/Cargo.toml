[workspace]
resolver = "2"
members = [
    "crates/superpowers-kanban-core",
    "crates/superpowers-kanban-ipc",
    "crates/superpowers-kanban-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
