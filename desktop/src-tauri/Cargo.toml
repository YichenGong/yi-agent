[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# The sidecar supervisor sleeps between respawn attempts; `tauri::async_runtime`
# has no timer, so depend on tokio's time driver directly.
tokio = { version = "1", features = ["time"] }
# `bridge::home_dir` must resolve the same directory as the app (whose
# `app.path().home_dir()` drives the sidecar's cwd) without an `AppHandle`:
# `set_relay_url` has the handle, but the pure `configured_relay_in` used by
# tests does not. `dirs` reads `$HOME`, which is what Tauri returns on macOS.
dirs = "6"

[dev-dependencies]
# Bridge tests write/read `preferences.json` in a throwaway home.
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
