[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 隔离 WebView 技术探针。**永远不出现在正式构建里**：它编译额外的原生窗口
# 编排与测试身份注入，开启后 `--plugin-probe-run` 才会被识别。默认关闭，
# `tauri build` 不带它，因此正式包不可能带上测试后门。
plugin-probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the sidecar's `internal-runtime identity --json` output at build time.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# The sidecar supervisor sleeps between respawn attempts; `tauri::async_runtime`
# has no timer, so depend on tokio's time driver directly. `rt` is what lets the
# quit barrier spawn one blocking release per project and join them in parallel.
tokio = { version = "1", features = ["time", "rt"] }
# `bridge::home_dir` must resolve the same directory as the app (whose
# `app.path().home_dir()` drives the sidecar's cwd) without an `AppHandle`:
# `set_relay_url` has the handle, but the pure `configured_relay_in` used by
# tests does not. `dirs` reads `$HOME`, which is what Tauri returns on macOS.
dirs = "6"
# remote.json / remote-status.json 的唯一临时名需要它（并发写者不得共用同一路径）。
uuid = { version = "1", features = ["v4"] }
# flock 用于跨进程的读-改-写互斥。
libc = "0.2"
# 远端二进制下载后必须校验 sha256 才允许落盘。
sha2 = "0.10"
# 复用 tauri 已经拉进来的 reqwest（0.13）做阻塞下载，避免再多一棵依赖树。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# 开关判定的唯一真源。本 crate 刻意不依赖 `yi-agent-store`（它带 bundled
# rusqlite），所以引入它不会把 SQLite 链进桌面二进制。
yi-agent-flags = { path = "../../yi-agent-rs/crates/yi-agent-flags" }
# 生命周期控制协议。与 `yi-agent-flags` 同理，它是刻意保持轻量的 crate：只带
# serde/libc。桌面壳**直接**持有租约与心跳（App 的身份不随 sidecar 重启改变），
# 所以它必须是桌面自己的依赖，而不是经 supervisors 间接获得（那会拖进 SQLite）。
yi-agent-lifecycle = { path = "../../yi-agent-rs/crates/yi-agent-lifecycle" }
# 插件视图的资源服务要复用验签/清单/生命周期的**值类型与校验**，不能自己
# 再造一份。这个 crate 不依赖 SQLite，所以不会把数据库链进桌面二进制。
yi-agent-plugins = { path = "../../yi-agent-rs/crates/yi-agent-plugins" }

[dev-dependencies]
# Bridge tests write/read `preferences.json` in a throwaway home.
tempfile = "3"
# MockRuntime for window/run-event tests.
tauri = { version = "2", features = ["test"] }
# The quit-barrier tests drive a paused clock, so the deadline and the Tokio
# timers that enforce it must read the same time source.
tokio = { version = "1", features = ["time", "rt", "macros", "test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
